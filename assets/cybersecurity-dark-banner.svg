<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cybersecurity + AI/ML Banner</title>
  <desc id="desc">Dark futuristic banner with neon grid and text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>

  <g opacity="0.2" stroke="#22D3EE" stroke-width="1">
    <path d="M0 300H1280"/>
    <path d="M0 330H1280"/>
    <path d="M0 360H1280"/>
    <path d="M0 390H1280"/>
    <path d="M120 230V420"/>
    <path d="M240 230V420"/>
    <path d="M360 230V420"/>
    <path d="M480 230V420"/>
    <path d="M600 230V420"/>
    <path d="M720 230V420"/>
    <path d="M840 230V420"/>
    <path d="M960 230V420"/>
    <path d="M1080 230V420"/>
    <path d="M1200 230V420"/>
  </g>

  <g filter="url(#softGlow)">
    <path d="M70 80H1210" stroke="url(#glow)" stroke-width="3"/>
    <path d="M70 340H1210" stroke="url(#glow)" stroke-width="3"/>
  </g>

  <text x="72" y="160" fill="#E5E7EB" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="56" font-weight="700">
    PRATIBHA KUMARI
  </text>
  <text x="72" y="220" fill="#22D3EE" font-family="Consolas, Menlo, monospace" font-size="34" font-weight="600">
    CYBERSECURITY • AI/ML
  </text>
  <text x="72" y="270" fill="#9CA3AF" font-family="Consolas, Menlo, monospace" font-size="24">
    Threat Detection | Secure AI Systems | Model Risk Monitoring
  </text>

  <g transform="translate(910 112)">
    <rect x="0" y="0" width="300" height="190" rx="16" fill="#0B1220" stroke="#334155"/>
    <text x="24" y="42" fill="#22D3EE" font-family="Consolas, Menlo, monospace" font-size="20">$ mission --focus</text>
    <text x="24" y="84" fill="#E5E7EB" font-family="Consolas, Menlo, monospace" font-size="18">hardening AI pipelines</text>
    <text x="24" y="116" fill="#E5E7EB" font-family="Consolas, Menlo, monospace" font-size="18">automated threat hunting</text>
    <text x="24" y="148" fill="#E5E7EB" font-family="Consolas, Menlo, monospace" font-size="18">secure-by-default tooling</text>
  </g>
</svg>
